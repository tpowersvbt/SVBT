# Apply only after backing up/migrating any existing SQLite data and PDF archives.
services:
  - type: web
    name: svbt-rkqn
    runtime: node
    region: oregon
    plan: starter
    numInstances: 1
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: svbt-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: APP_ORIGIN
        value: https://siliconvalleybankandtrust.com
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "3000"
      - key: DB_PATH
        value: /var/data/bank.sqlite
      - key: STATEMENT_DIR
        value: /var/data/statements
      - key: TRUST_PROXY
        value: "true"
      - key: DEMO_SEED
        value: "false"
