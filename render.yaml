# Render Blueprint for Silicon Valley Bank and Trust (livesvbt)
services:
  - type: web
    name: svbt
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_SEED
        value: "false"
      - key: HOST
        value: "0.0.0.0"
      - key: MODERATOR_EMAIL
        sync: false
      - key: MODERATOR_PASSWORD
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: DB_PATH
        value: /opt/render/project/src/data/bank.sqlite
      - key: STATEMENT_DIR
        value: /opt/render/project/src/monthly/statements
