services:
  - type: web
    name: svbt
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: NODE_ENV=production npm start
    envVars:
      - key: APP_ORIGIN
        value: https://siliconvalleybankandtrust.com
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      - key: DB_PATH
        value: ./data/bank.sqlite
      - key: STATEMENT_DIR
        value: ./monthly/statements
      - key: TRUST_PROXY
        value: true
      - key: DEMO_SEED
        value: true
      - key: DEMO_MODERATOR_EMAIL
        value: tpower@siliconvalleybankandtrust.com
      - key: DEMO_MODERATOR_PASSWORD
        value: ModeratorGod!2026
