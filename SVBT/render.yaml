services:
  - type: web
    name: svbt
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: NODE_ENV=production npm start
    healthCheckPath: /api/health
    disk:
      name: svbt-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ORIGIN
        sync: false
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: true
      - key: DEMO_SEED
        value: false
      - key: SAMPLE_DATA
        value: true
      # Optional email delivery for staff invitations and password links (Resend).
      # Leave unset and Administration shows the link on screen to copy instead.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
